apiVersion: v1
metadata:
  name: cinder-iscsi-cloud-config
  namespace: kube-system
data:
  cloud.conf: W0dsb2JhbF0KdXNlcm5hbWUgPSBhZG1pbgpwYXNzd29yZCA9IG5vbW9yZXNlY3JldApkb21haW4tbmFtZSA9IGRlZmF1bHQKYXV0aC11cmwgPSBodHRwOi8vMTkyLjE2OC4yMDAuOS9pZGVudGl0eQp0ZW5hbnQtaWQgPSBjYzM0YjExZmY5NWQ0MjMwOTA4MWQwYmQ0NmMwZmY4OQpyZWdpb24gPSBSZWdpb25PbmUK

---
# ConfigMap for iSCSI driver configuration (driver.conf)
# This contains no credentials — can be managed independently from the Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinder-iscsi-driver-config
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: wrc-migration
    app.kubernetes.io/component: csi-config
data:
  driver.conf: |
    [ISCSI]
    enable-multipath = false
    chap-auth-enabled = true
    login-timeout = 30
    device-wait-timeout = 30
    # iscsi-interface: The iSCSI initiator interface name as defined in
    # /etc/iscsi/ifaces/. Use "default" to let open-iscsi pick the transport.
    # If you have a dedicated storage NIC (e.g., eth1 on a storage VLAN),
    # create a custom iface in /etc/iscsi/ifaces/ bound to that NIC and
    # set this value to match it, e.g.:
    #   iscsi-interface = iface-storage
    # This ensures iSCSI sessions are established over the correct transport.
    iscsi-interface = default
    # storage-interface: The host network interface used for iSCSI storage traffic.
    # Leave empty to use the OS default routing table to reach the iSCSI target.
    # If the node has a dedicated storage NIC (e.g., eth1, bond1), set this to
    # that interface name so the plugin directs all iSCSI I/O over it, e.g.:
    #   storage-interface = eth1
    # This is especially important when the storage network is on a separate
    # VLAN/subnet to avoid traffic routing over the management interface.
    storage-interface =
    platform = x86_64
    os-type = linux2

    [Volume]
    create-timeout = 300
    detach-timeout = 120
    delete-volume-mode = retain
