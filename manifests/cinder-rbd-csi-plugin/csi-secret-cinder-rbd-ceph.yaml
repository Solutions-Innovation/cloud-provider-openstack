---
# Ceph credential for the NODE plugin.
#
# The operator duplicates the existing platform client.cinder key into this
# Secret. Do NOT commit a real key. Create it out of band:
#
#   kubectl -n openstack get secret cinder-volume-rbd-keyring \
#     -o jsonpath='{.data.key}' | base64 -d > /tmp/k && chmod 600 /tmp/k
#   kubectl -n kube-system create secret generic cinder-rbd-ceph-client \
#     --from-literal=userID=cinder --from-file=userKey=/tmp/k
#   shred -u /tmp/k
#
# The entity in userID must match the auth_username Cinder returns, because
# kernel RBD requires --id and the keyring entity to be the same identity.
# Rotation needs no pod restart: kubelet refreshes the projected Secret and the
# driver re-reads it on every NodeStageVolume. See the operator runbook.
apiVersion: v1
kind: Secret
metadata:
  name: cinder-rbd-ceph-client
  namespace: kube-system
type: Opaque
stringData:
  userID: cinder
  userKey: <REPLACE-OUT-OF-BAND-DO-NOT-COMMIT>
