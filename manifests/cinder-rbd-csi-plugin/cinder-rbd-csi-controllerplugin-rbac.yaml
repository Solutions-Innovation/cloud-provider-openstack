# RBAC for the Cinder RBD CSI CONTROLLER plugin (external-attacher, external-provisioner).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cinder-rbd-openstack-cinder-rbd-csi-controller-sa
  namespace: kube-system
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cinder-rbd-openstack-cinder-rbd-csi-attacher-role
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
  - patch
- apiGroups:
  - storage.k8s.io
  resources:
  - csinodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - volumeattachments
  verbs:
  - get
  - list
  - watch
  - patch
- apiGroups:
  - storage.k8s.io
  resources:
  - volumeattachments/status
  verbs:
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - watch
  - list
  - delete
  - update
  - create
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cinder-rbd-openstack-cinder-rbd-csi-provisioner-role
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - patch
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - csinodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - storage.k8s.io
  resources:
  - volumeattachments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - watch
  - list
  - delete
  - update
  - create
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cinder-rbd-openstack-cinder-rbd-csi-attacher-binding
subjects:
- kind: ServiceAccount
  name: cinder-rbd-openstack-cinder-rbd-csi-controller-sa
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cinder-rbd-openstack-cinder-rbd-csi-attacher-role
  apiGroup: rbac.authorization.k8s.io
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cinder-rbd-openstack-cinder-rbd-csi-provisioner-binding
subjects:
- kind: ServiceAccount
  name: cinder-rbd-openstack-cinder-rbd-csi-controller-sa
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cinder-rbd-openstack-cinder-rbd-csi-provisioner-role
  apiGroup: rbac.authorization.k8s.io
