---
# Source: openstack-cinder-rbd-csi/templates/controllerplugin-deployment.yaml
kind: Deployment
apiVersion: apps/v1
metadata:
  name: openstack-cinder-rbd-csi-controllerplugin
  namespace: kube-system
  labels:
    component: controllerplugin
    app: openstack-cinder-rbd-csi
    release: cinder-rbd
    chart: openstack-cinder-rbd-csi-2.35.0
    heritage: Helm
  annotations:
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      component: controllerplugin
      app: openstack-cinder-rbd-csi
      release: cinder-rbd
  template:
    metadata:
      labels:
        component: controllerplugin
        app: openstack-cinder-rbd-csi
        release: cinder-rbd
        chart: openstack-cinder-rbd-csi-2.35.0
        heritage: Helm
        
      annotations:
        
        
    spec:
      serviceAccount: cinder-rbd-openstack-cinder-rbd-csi-controller-sa
      securityContext:
        {}
      containers:
        - name: csi-attacher
          securityContext:
            {}
          image: "registry.k8s.io/sig-storage/csi-attacher:v4.10.0"
          imagePullPolicy: IfNotPresent
          args:
            - "-v=2"
            - "--csi-address=$(ADDRESS)"
            - "--timeout=3m"
            - "--leader-election=true"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
          resources: 
            {}
        - name: csi-provisioner
          securityContext:
            {}
          image: "registry.k8s.io/sig-storage/csi-provisioner:v5.3.0"
          imagePullPolicy: IfNotPresent
          args:
            - "-v=2"
            - "--csi-address=$(ADDRESS)"
            - "--timeout=3m"
            - "--leader-election=true"
            - "--extra-create-metadata"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
          resources: 
            {}
        - name: liveness-probe
          securityContext:
            {}
          image: "registry.k8s.io/sig-storage/livenessprobe:v2.17.0"
          imagePullPolicy: IfNotPresent
          args:
            - "-v=2"
            - "--csi-address=$(ADDRESS)"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - mountPath: /var/lib/csi/sockets/pluginproxy/
              name: socket-dir
          resources: 
            {}
        - name: cinder-rbd-csi-plugin
          securityContext:
            {}
          image: "ghcr.io/solutions-innovation/cinder-rbd-csi-plugin:v1.35.0"
          imagePullPolicy: Always
          args:
            - /bin/cinder-rbd-csi-plugin
            - "-v=2"
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--cloud-config=$(CLOUD_CONFIG)"
            - "--cloud-config=/etc/config/driver.conf"
            - "--cluster=$(CLUSTER_NAME)"
            - "--provide-node-service=false"
          env:
            - name: CSI_ENDPOINT
              value: unix://csi/csi.sock
            - name: CLOUD_CONFIG
              value: /etc/config/cloud.conf
            - name: CLUSTER_NAME
              value: "kubernetes"
          ports:
            - containerPort: 9808
              name: healthz
              protocol: TCP
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 60
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: cloud-config
              mountPath: /etc/config/cloud.conf
              subPath: cloud.conf
              readOnly: true
            - name: driver-config
              mountPath: /etc/config/driver.conf
              subPath: driver.conf
              readOnly: true
          resources: 
            {}
      volumes:
        - name: socket-dir
          emptyDir:
        - name: cloud-config
          secret:
            secretName: cinder-rbd-csi-cloud-config
        - name: driver-config
          configMap:
            name: cinder-rbd-driver-config
      affinity: 
        {}
      nodeSelector: 
        {}
      tolerations: 
        []

