---
# Cinder credentials for the CONTROLLER plugin only.
#
# The node plugin never reads cloud.conf and never calls Keystone or Cinder: it
# only maps images with the Ceph credential from a separate Secret (see below).
#
# Create from a real cloud.conf rather than editing this file:
#   kubectl -n kube-system create secret generic cinder-rbd-csi-cloud-config \
#     --from-file=cloud.conf=/etc/kubernetes/cloud.conf
apiVersion: v1
kind: Secret
metadata:
  name: cinder-rbd-csi-cloud-config
  namespace: kube-system
type: Opaque
stringData:
  cloud.conf: |-
    [Global]
    auth-url=<keystone-url>
    username=<username>
    password=<password>
    region=RegionOne
    tenant-name=<project>
    domain-name=Default
