---
# Source: openstack-cinder-rbd-csi/templates/driverconfig.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinder-rbd-driver-config
  namespace: kube-system
  labels:
    app.kubernetes.io/name: openstack-cinder-rbd-csi
    helm.sh/chart: openstack-cinder-rbd-csi-2.35.0
    app.kubernetes.io/instance: cinder-rbd
    app.kubernetes.io/version: "v1.35.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: wrc-migration
    app.kubernetes.io/component: csi-config
data:
  driver.conf: |
    # Generated by the openstack-cinder-rbd-csi Helm chart. Do not edit in place.
    #
    # Authentication lives separately in cloud.conf ([Global], from a Secret).
    # This file carries no credentials: expected-fsid is an environment
    # identifier and credential-path only names a directory.

    [RBD]
    mounter = krbd
    exclusive = true
    expected-cluster-name = ceph
    expected-fsid = c5f7876d-258c-4152-b26a-a3ab532fda28
    ceph-client-version-major = 18
    credential-path = /etc/cinder-rbd-csi/ceph
    runtime-dir = /run/cinder-rbd-csi
    state-dir = /var/lib/cinder-rbd-csi
    map-timeout = 120s
    unmap-timeout = 120s
    device-wait-timeout = 60s
    max-volumes-per-node = 0

    [Volume]
    create-timeout = 300
    detach-timeout = 120
    default-volume-type = ceph-rook-store
    metadata-prefix = csi.rbd
    delete-volume-mode = retain

