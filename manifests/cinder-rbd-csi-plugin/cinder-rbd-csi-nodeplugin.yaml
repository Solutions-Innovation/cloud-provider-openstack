---
# Source: openstack-cinder-rbd-csi/templates/nodeplugin-daemonset.yaml
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: openstack-cinder-rbd-csi-nodeplugin
  namespace: kube-system
  labels:
    component: nodeplugin
    app: openstack-cinder-rbd-csi
    release: cinder-rbd
    chart: openstack-cinder-rbd-csi-2.35.0
    heritage: Helm
  annotations:
spec:
  selector:
    matchLabels:
      component: nodeplugin
      app: openstack-cinder-rbd-csi
      release: cinder-rbd
  template:
    metadata:
      labels:
        component: nodeplugin
        app: openstack-cinder-rbd-csi
        release: cinder-rbd
        chart: openstack-cinder-rbd-csi-2.35.0
        heritage: Helm
        
      annotations:
        
        
    spec:
      serviceAccount: cinder-rbd-openstack-cinder-rbd-csi-node-sa
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        {}
      containers:
        - name: node-driver-registrar
          securityContext:
            {}
          image: "registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.15.0"
          imagePullPolicy: IfNotPresent
          args:
            - "-v=2"
            - "--csi-address=$(ADDRESS)"
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/cinder-rbd.csi.windriver.com/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          resources: 
            {}
        - name: liveness-probe
          securityContext:
            {}
          image: "registry.k8s.io/sig-storage/livenessprobe:v2.17.0"
          imagePullPolicy: IfNotPresent
          args:
            - "-v=2"
            - --csi-address=/csi/csi.sock
          env:
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources: 
            {}
        - name: cinder-rbd-csi-plugin
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          image: "ghcr.io/solutions-innovation/cinder-rbd-csi-plugin:v1.35.0"
          imagePullPolicy: Always
          args:
            - /bin/cinder-rbd-csi-plugin
            - "-v=2"
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--provide-controller-service=false"
            - "--cloud-config=/etc/config/driver.conf"
          env:
            - name: CSI_ENDPOINT
              value: unix://csi/csi.sock
          ports:
            - containerPort: 9808
              name: healthz
              protocol: TCP
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: "Bidirectional"
            - name: pods-probe-dir
              mountPath: /dev
              mountPropagation: "HostToContainer"
            # /sys must be WRITABLE: `rbd device map` and `unmap` work by
            # writing to /sys/bus/rbd/{add,remove}. A read-only mount makes
            # every map fail.
            - name: sys-dir
              mountPath: /sys
            # Private runtime directory for the generated ceph.conf and keyring.
            # Memory-backed so key material never reaches disk.
            - name: rbd-runtime-dir
              mountPath: /run/cinder-rbd-csi
            # Durable staging index; must survive plugin restarts, so it is a
            # hostPath rather than an emptyDir.
            - name: rbd-state-dir
              mountPath: /var/lib/cinder-rbd-csi
            # Operator-managed Ceph credential, projected read-only. The plugin
            # needs no Secret RBAC because it reads files, not the API.
            - name: ceph-credentials
              mountPath: /etc/cinder-rbd-csi/ceph
              readOnly: true
            - name: driver-config
              mountPath: /etc/config/driver.conf
              subPath: driver.conf
              readOnly: true
          resources: 
            {}
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/cinder-rbd.csi.windriver.com
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: pods-probe-dir
          hostPath:
            path: /dev
            type: Directory
        - name: sys-dir
          hostPath:
            path: /sys
            type: Directory
        - name: rbd-runtime-dir
          emptyDir:
            medium: Memory
        - name: rbd-state-dir
          hostPath:
            path: /var/lib/cinder-rbd-csi
            type: DirectoryOrCreate
        - name: ceph-credentials
          secret:
            secretName: cinder-rbd-ceph-client
            defaultMode: 0400
            items:
              - key: userID
                path: userID
              - key: userKey
                path: userKey
        - name: driver-config
          configMap:
            name: cinder-rbd-driver-config
      affinity: 
        {}
      nodeSelector: 
        {}
      tolerations: 
        - operator: Exists

