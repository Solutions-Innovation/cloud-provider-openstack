# StorageClass for the cinder-iscsi CSI driver.
# Uses the LVM iSCSI backend on the target OpenStack cloud.
# volumeBindingMode must be Immediate (not WaitForFirstConsumer) because
# CDI multi-phase migration creates intermediate PVCs that are not directly
# consumed by a scheduled pod — Immediate ensures they are provisioned right away.

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-sc-cinder-iscsi
  labels:
    app.kubernetes.io/part-of: wrc-migration
provisioner: cinder-iscsi.csi.windriver.com
parameters:
  # Cinder volume type — must match an LVM iSCSI backend type in your cloud.
  # Run `openstack volume type list` to see available types.
  # type: lvmdriver-1
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
