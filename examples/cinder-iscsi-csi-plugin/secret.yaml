---
# ConfigMap for iSCSI driver configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinder-iscsi-driver-config
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: wrc-migration
    app.kubernetes.io/component: csi-config
data:
  driver.conf: |
    [ISCSI]
    enable-multipath = false
    chap-auth-enabled = true
    login-timeout = 30
    device-wait-timeout = 30
    iscsi-interface = default
    storage-interface =
    platform = x86_64
    os-type = linux2

    [Volume]
    create-timeout = 300
    detach-timeout = 120
    delete-volume-mode = retain
