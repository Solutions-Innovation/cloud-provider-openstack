# Nginx pod with a raw block PVC backed by the cinder-iscsi CSI driver.
# Smoke test: create a Cinder volume, attach via iSCSI, expose as /dev/xvda
# inside the container. The iSCSI-Cinder driver only supports volumeMode: Block.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: csi-pvc-cinder-iscsi
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Block
  resources:
    requests:
      storage: 1Gi
  storageClassName: csi-sc-cinder-iscsi

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-cinder-iscsi
spec:
  containers:
  - name: nginx
    image: nginx
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 80
      protocol: TCP
    volumeDevices:
    - name: csi-data-cinder-iscsi
      devicePath: /dev/xvda
  volumes:
  - name: csi-data-cinder-iscsi
    persistentVolumeClaim:
      claimName: csi-pvc-cinder-iscsi
      readOnly: false
