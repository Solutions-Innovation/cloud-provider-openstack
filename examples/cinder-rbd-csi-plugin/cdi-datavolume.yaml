---
# A CDI DataVolume importing a disk image into a Cinder RBD volume.
#
# The StorageProfile named after the StorageClass must exist first, or CDI
# defaults to volumeMode: Filesystem and this PVC hangs Pending. See
# manifests/cinder-rbd-csi-plugin/cdi-storageprofile-patch.yaml.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: migrated-vm-disk
spec:
  source:
    http:
      url: https://example.invalid/path/to/disk.qcow2
  pvc:
    accessModes:
      - ReadWriteOnce
    volumeMode: Block
    resources:
      requests:
        storage: 20Gi
    storageClassName: cinder-rbd-migration
