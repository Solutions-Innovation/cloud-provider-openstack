# Target Cinder volume, exposed as a raw block device (not a filesystem) so
# that dd can write the converted RAW image directly onto it.
#
# storageClassName defaults to "csi-sc-cinderplugin", the StorageClass
# name used throughout this project's own examples/docs for the Cinder
# CSI driver (see e.g. ../block/block.yaml and
# ../../../docs/cinder-csi-plugin/using-cinder-csi-plugin.md). A
# StorageClass is cluster-level infrastructure tied to an actual CSI
# driver deployment -- this manifest doesn't create one, it only
# references it, so update the name below (or point it at a different
# StorageClass you already have) to match what's actually deployed in
# your cluster. If you'd rather use the cluster's default StorageClass
# instead of naming one explicitly, delete this field entirely (that is
# what was used during this example's own testing, since the test
# cluster had no Cinder CSI driver installed and relied on a
# Ceph-RBD-backed default StorageClass instead).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-import-target-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  storageClassName: csi-sc-cinderplugin
  resources:
    requests:
      # Must be >= the size of the converted RAW disk image. Verified in
      # testing with 20Gi against a 16GiB source disk, and 15Gi against a
      # 10GiB source disk.
      storage: 20Gi

---
# PVC-backed scratch space for CONVERT_MODE=qemu-img and
# CONVERT_MODE=virt-v2v, both of which need to materialize a full
# intermediate RAW file (roughly the source disk's *virtual* size, not
# its compressed/actual size) before `dd`-ing it onto the target device.
#
# This exists as a separate, deletable PVC (rather than relying on the
# scheduling node's local disk via `emptyDir`, see the `workdir` volume
# below for that alternative) because the local-disk approach breaks down
# once the source disk is large: a Job's `emptyDir` is backed by whatever
# local filesystem the node happens to have free space on (commonly a
# constrained partition like /var/lib/kubelet, not the node's full disk),
# and Windows system disks in particular are routinely 60-100+ GiB of
# *virtual* size even when their actual used/compressed data is much
# smaller. A PVC backed by a real storage backend (Cinder, Ceph RBD, etc,
# whatever `storageClassName` below resolves to) is not limited by a
# single node's local free space and is the only reliable option once
# the source disk size exceeds what the node can spare locally. Verified
# in testing: a 90GiB-virtual/~5.2GiB-actual Windows Server 2019
# streamOptimized VMDK could not fit in this test cluster's node-local
# emptyDir (only ~47GiB free on the relevant partition) but converted
# successfully once `workdir` below was switched to this PVC, backed by a
# Ceph RBD pool with ~1TiB free.
#
# Not needed under the default CONVERT_MODE=qemu-img-direct, which never
# writes an intermediate RAW file at all -- see the `workdir` volume
# below for how to use a plain `emptyDir` instead in that case, which
# avoids provisioning (and paying for) this extra volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-import-workdir-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: csi-sc-cinderplugin
  resources:
    requests:
      # Must be >= ~2x the source disk's virtual size (one copy for the
      # intermediate RAW file, plus headroom for the downloaded/extracted
      # source image itself). Verified in testing with 110Gi against a
      # 90GiB-virtual-size Windows source disk.
      storage: 110Gi

---
# One-shot Job that converts the source OVA/OVF/VMDK image to RAW and
# writes it onto the Cinder-backed block device, using qemu-img for both
# steps. The conversion script (convert-and-import.sh) is baked into the
# image as its ENTRYPOINT; see Dockerfile in this directory.
#
# Default (CONVERT_MODE=qemu-img-direct) writes straight to TARGET_DEVICE
# via `qemu-img convert -n --target-is-zero -O raw`, skipping any
# intermediate RAW file entirely. This doesn't need scratch space
# proportional to the source disk's virtual size -- only enough to
# download/extract the compressed source image itself, which for a
# streamOptimized VMDK (the common VMware/OVA export format) is typically
# far smaller. Verified end-to-end against a 10GiB-virtual/~1GiB-actual
# CoreOS .ova: completed in ~20 seconds with a sha256 checksum identical to
# the qemu-img (file + dd) path. This relies on the target device
# genuinely reading back as all-zero; the script verifies this
# automatically before writing and refuses to proceed otherwise (see
# OPERATIONS-GUIDE.md Section 3 for the full explanation).
#
# If TARGET_DEVICE might not read back as zero (e.g. a reused volume) or
# you'd rather not depend on that assumption, set CONVERT_MODE=qemu-img
# instead: it converts to a scratch RAW file first, then `dd`s it onto
# the device. Verified end-to-end against the same CoreOS .ova above (and
# a second, Fedora Server BIOS/MBR+LVM guest) -- also successful, just
# slower (~90s convert + ~130s dd, vs. ~20s total for qemu-img-direct) and
# needing roughly 2x the virtual disk size in scratch space.
#
# For WINDOWS guests, set CONVERT_MODE=virt-v2v instead -- this is
# REQUIRED, not optional. qemu-img-direct/qemu-img are pure format
# converters that never touch the guest filesystem; a Windows VM exported
# from VMware typically fails to boot under KVM/QEMU without driver
# injection and boot-configuration fixups, which only virt-v2v performs.
# virt-v2v also needs real KVM acceleration (the
# devices.kubevirt.io/kvm resource requests/limits, commented out below)
# to run in reasonable time, and converts to a scratch RAW file first
# like CONVERT_MODE=qemu-img (it cannot write directly to a block device),
# so size `workdir` accordingly -- see the vm-import-workdir-pvc PVC above
# for why a PVC-backed workdir (rather than emptyDir) is recommended for
# this mode. See OPERATIONS-GUIDE.md Section 3 for the full comparison.
apiVersion: batch/v1
kind: Job
metadata:
  name: vm-import-job
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: vm-import
          # Built from the Dockerfile in this directory.
          image: jonzhang/vm-import:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SOURCE_IMAGE_PATH
              # Path as seen INSIDE THE CONTAINER (under the source-input
              # mount below), not a path on your workstation. Point this
              # at a specific file for a single .ova/.vmdk, e.g.:
              #   value: "/input/my-vm.ova"
              # For a bare OVF directory (loose .ovf + .vmdk + .nvram +
              # etc., not packaged into a single .ova), point this at the
              # DIRECTORY itself instead -- the script finds the .ovf
              # descriptor and its referenced .vmdk inside it
              # automatically. Verified in testing: a 16GiB-virtual/
              # ~1.7GiB-actual Fedora Server OVF directory (BIOS/MBR+LVM
              # guest) with this exact pattern:
              #   value: "/input"
              value: "/input/CHANGE-ME-source.ova"
            # SOURCE_IMAGE_URL is the alternative when the source image is
            # reachable over HTTP(S) instead of mounted locally, e.g.:
            #   - name: SOURCE_IMAGE_URL
            #     value: "https://example.com/path/to/source.ova"
            - name: TARGET_DEVICE
              value: "/dev/xvda"
            - name: CONVERT_MODE
              value: "qemu-img-direct" # "qemu-img", or "virt-v2v" (REQUIRED for Windows guests) -- see notes above
            - name: DD_BLOCK_SIZE
              value: "4M"
            - name: VERIFY_CHECKSUM
              value: "false"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              # Uncomment both the request and limit below if you switch
              # CONVERT_MODE to "virt-v2v" -- it needs access to /dev/kvm
              # via the KubeVirt device plugin for KVM-accelerated
              # conversion. Leave commented out for qemu-img-direct/
              # qemu-img, which don't use KVM.
              # devices.kubevirt.io/kvm: "1"
            limits:
              cpu: "2"
              memory: "2Gi"
              # devices.kubevirt.io/kvm: "1"
          volumeDevices:
            - name: vm-import-target
              devicePath: /dev/xvda
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: source-input
              mountPath: /input
              readOnly: true
      volumes:
        - name: vm-import-target
          persistentVolumeClaim:
            claimName: vm-import-target-pvc
            readOnly: false
        # PVC-backed workdir (see vm-import-workdir-pvc above for sizing
        # rationale). Recommended default here because it works
        # correctly regardless of source disk size or the scheduling
        # node's local free space -- which matters most for
        # CONVERT_MODE=qemu-img and CONVERT_MODE=virt-v2v (both need a
        # full intermediate RAW file), and especially for virt-v2v with
        # large Windows source disks, where node-local space is the most
        # likely thing to run out. Costs an extra PVC (storage billed/
        # reserved) compared to emptyDir below, even when you end up
        # using the qemu-img-direct default that doesn't actually need
        # the space.
        #
        # If you know you'll only ever use CONVERT_MODE=qemu-img-direct
        # (no intermediate RAW file, so workdir only needs to hold the
        # downloaded/extracted source image -- typically far smaller
        # than its virtual size for a streamOptimized VMDK) AND your
        # source images are small enough to comfortably fit the
        # scheduling node's local free disk space, you can swap this
        # for a plain emptyDir instead and skip provisioning
        # vm-import-workdir-pvc entirely:
        #   - name: workdir
        #     emptyDir:
        #       sizeLimit: 40Gi
        - name: workdir
          persistentVolumeClaim:
            claimName: vm-import-workdir-pvc
            readOnly: false
        # Points at the source file/directory on the NODE (not inside the
        # container) for SOURCE_IMAGE_PATH to mount in as /input. Replace
        # the path below with wherever your source .ova/.vmdk/OVF
        # directory actually lives on the scheduling node. Testing used a
        # path like /home/<user>/vm-import/<source-name> on a single-node
        # test cluster; a hostPath volume ties the Pod to that specific
        # node (see OPERATIONS-GUIDE.md Section 4.1 for the SOURCE_IMAGE_URL
        # alternative, which has no such constraint).
        - name: source-input
          hostPath:
            path: /CHANGE-ME/path/to/your/source-image-or-ovf-directory
            type: Directory
