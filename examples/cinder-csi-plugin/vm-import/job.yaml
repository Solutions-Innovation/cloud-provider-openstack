# Target Cinder volume, exposed as a raw block device (not a filesystem) so
# that qemu-img/virt-v2v-in-place can write/modify the disk image directly.
#
# storageClassName defaults to "csi-sc-cinderplugin", the StorageClass
# name used throughout this project's own examples/docs for the Cinder
# CSI driver (see e.g. ../block/block.yaml and
# ../../../docs/cinder-csi-plugin/using-cinder-csi-plugin.md). A
# StorageClass is cluster-level infrastructure tied to an actual CSI
# driver deployment -- this manifest doesn't create one, it only
# references it, so update the name below (or point it at a different
# StorageClass you already have) to match what's actually deployed in
# your cluster. If you'd rather use the cluster's default StorageClass
# instead of naming one explicitly, delete this field entirely (that is
# what was used during this example's own testing, since the test
# cluster had no Cinder CSI driver installed and relied on a
# Ceph-RBD-backed default StorageClass instead).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-import-target-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  storageClassName: csi-sc-cinderplugin
  resources:
    requests:
      # Must be >= the virtual size of the source disk. Verified in
      # testing with 20Gi against a 16GiB source disk, 15Gi against a
      # 10GiB source disk, and 95Gi against a 90GiB-virtual-size Windows
      # source disk.
      storage: 20Gi

---
# One-shot Job that writes the source OVA/OVF/VMDK image onto the
# Cinder-backed block device. The conversion script
# (convert-and-import.sh) is baked into the image as its ENTRYPOINT; see
# Dockerfile in this directory.
#
# Two CONVERT_MODE values are supported, both writing straight onto
# TARGET_DEVICE via `qemu-img convert -n --target-is-zero -O raw` with no
# intermediate RAW file at any point -- so scratch space (the `workdir`
# volume below) only ever needs to hold the downloaded/extracted source
# image itself, never the (potentially much larger) virtual disk size.
# This relies on TARGET_DEVICE genuinely reading back as all-zero; the
# script verifies this automatically before writing and refuses to
# proceed otherwise (see OPERATIONS-GUIDE.md Section 3).
#
#   - CONVERT_MODE=direct (default) -- just the write described above.
#     Verified end-to-end against a 10GiB-virtual/~1GiB-actual CoreOS
#     .ova: completed in ~20 seconds. Sufficient for most Linux guests
#     (modern distros already include virtio drivers and don't hardcode
#     hypervisor-specific boot paths), but NOT sufficient for Windows
#     guests, which need the driver injection/boot-configuration fixup
#     that only virt-v2v provides -- see CONVERT_MODE=direct-v2v below.
#   - CONVERT_MODE=direct-v2v -- for WINDOWS guests. Runs the same write
#     as CONVERT_MODE=direct, then runs `virt-v2v-in-place` directly
#     against TARGET_DEVICE to inject drivers and fix up the boot
#     configuration IN PLACE on the data just written. Verified
#     end-to-end against a 90GiB-virtual/~5.2GiB-actual Windows Server
#     2019 guest: ~6.2 minutes total (direct write ~3 min + virt-v2v-in-
#     place ~3.2 min), with no KVM acceleration available on the test
#     node, using only the default 8Gi `workdir` emptyDir below -- no
#     large scratch volume needed. Produced a correct GPT layout and
#     NTFS boot-sector signature on the target device.
#     IMPORTANT: virt-v2v-in-place modifies TARGET_DEVICE's data IN
#     PLACE, with NO backup. Per upstream's own documentation, if it
#     fails, "the disk image will be in an unknown, possibly corrupted
#     state." Only use this mode against a freshly provisioned,
#     disposable target volume -- one you can recreate from the source
#     image again if something goes wrong. Also requires the guest OS to
#     be recognized by libguestfs's inspection; OSTree/Ignition-based
#     Linux distributions (e.g. Fedora CoreOS) are NOT recognized and
#     will fail here -- use CONVERT_MODE=direct for those instead.
#
# Both modes benefit from real KVM acceleration for the virt-v2v-in-place
# step specifically (CONVERT_MODE=direct never uses KVM at all). KVM
# acceleration is enabled by default below via a privileged
# securityContext + LIBGUESTFS_BACKEND_SETTINGS (see the container-level
# comments further down) -- NOT via a devices.kubevirt.io/kvm resource
# request. Verified end-to-end on a real StarlingX (WRCP) cluster: that
# cluster's devices.kubevirt.io/kvm is registered on the node but
# allocatable=0 (no KubeVirt device plugin actively running), yet the
# privileged container could still open the host's /dev/kvm directly
# (confirmed via libguestfs's own appliance logs: "qemu KVM: enabled",
# and the guest kernel detecting "Hypervisor detected: KVM" and using
# kvm-clock) -- privileged bypasses Kubernetes' device-plugin gating
# entirely, so no devices.kubevirt.io/kvm request is needed (or useful)
# once privileged is set. Requesting that resource anyway, as an earlier
# version of this manifest did, actively breaks scheduling on any cluster
# where it's advertised with 0 allocatable (the common case when no
# KubeVirt device plugin is actually deployed) -- the Pod stays Pending
# forever. Both modes still work without KVM acceleration (e.g. if you
# remove the privileged block below), just much slower for direct-v2v,
# via software emulation. See OPERATIONS-GUIDE.md Section 2.3.1 and
# Section 3 for the full comparison and real numbers.
apiVersion: batch/v1
kind: Job
metadata:
  name: vm-import-job
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: vm-import
          # Built from the Dockerfile in this directory.
          image: jonzhang/vm-import:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SOURCE_IMAGE_PATH
              # Path as seen INSIDE THE CONTAINER (under the source-input
              # mount below), not a path on your workstation. Point this
              # at a specific file for a single .ova/.vmdk, e.g.:
              #   value: "/input/my-vm.ova"
              # For a bare OVF directory (loose .ovf + .vmdk + .nvram +
              # etc., not packaged into a single .ova), point this at the
              # DIRECTORY itself instead -- the script finds the .ovf
              # descriptor and its referenced .vmdk inside it
              # automatically. Verified in testing: a 16GiB-virtual/
              # ~1.7GiB-actual Fedora Server OVF directory (BIOS/MBR+LVM
              # guest) with this exact pattern:
              #   value: "/input"
              value: "/input/CHANGE-ME-source.ova"
            # SOURCE_IMAGE_URL is the alternative when the source image is
            # reachable over HTTP(S) instead of mounted locally, e.g.:
            #   - name: SOURCE_IMAGE_URL
            #     value: "https://example.com/path/to/source.ova"
            - name: TARGET_DEVICE
              value: "/dev/xvda"
            - name: CONVERT_MODE
              value: "direct" # or "direct-v2v" (for Windows guests) -- see notes above
            - name: VERIFY_CHECKSUM
              value: "false"
            # Forces libguestfs's internal QEMU appliance (used by
            # virt-v2v-in-place under CONVERT_MODE=direct-v2v) to launch
            # with -enable-kvm explicitly, rather than relying solely on
            # libguestfs's own automatic /dev/kvm detection. Only takes
            # effect together with the privileged securityContext below
            # (which is what actually grants permission to open
            # /dev/kvm -- see that field's comment for why no
            # devices.kubevirt.io/kvm resource request is needed here).
            # Unused (harmless) under CONVERT_MODE=direct, which never
            # launches the appliance.
            - name: LIBGUESTFS_BACKEND_SETTINGS
              value: "qemu_options=-enable-kvm"
          # Required (together with LIBGUESTFS_BACKEND_SETTINGS above)
          # for virt-v2v-in-place's internal appliance VM to actually
          # acquire and use /dev/kvm for hardware-accelerated conversion
          # under CONVERT_MODE=direct-v2v. privileged: true bypasses
          # Kubernetes' device-plugin gating entirely and lets the
          # container open the host's /dev/kvm directly -- no
          # devices.kubevirt.io/kvm resource request is needed (or
          # useful) once this is set. Verified end-to-end on a real
          # StarlingX (WRCP) cluster where devices.kubevirt.io/kvm was
          # registered but had allocatable=0 (no KubeVirt device plugin
          # actually running): the privileged container still
          # successfully obtained KVM acceleration (confirmed via
          # libguestfs's "qemu KVM: enabled" log line and the guest
          # kernel's "Hypervisor detected: KVM" / kvm-clock usage).
          # SECURITY: privileged grants the container near-host-root
          # capabilities (access to all host devices, ability to alter
          # kernel/network settings, a larger container-escape attack
          # surface) -- a materially higher-risk posture than an
          # unprivileged container. Only acceptable here because this is
          # a short-lived, one-shot Job (not a long-running service) whose
          # sole purpose is this low-level block-device/appliance-VM
          # operation. If your threat model does not accept this, remove
          # this block (and LIBGUESTFS_BACKEND_SETTINGS above) and accept
          # the slower software-emulation fallback instead.
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeDevices:
            - name: vm-import-target
              devicePath: /dev/xvda
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: source-input
              mountPath: /input
              readOnly: true
      volumes:
        - name: vm-import-target
          persistentVolumeClaim:
            claimName: vm-import-target-pvc
            readOnly: false
        # emptyDir scratch space. Neither CONVERT_MODE value ever writes
        # a full intermediate RAW file here -- both only need room for
        # the downloaded/extracted source image itself, which for a
        # streamOptimized VMDK (the common VMware/OVA export format) is
        # typically far smaller than its virtual size. Verified in
        # testing: this exact 8Gi sizeLimit was sufficient even for a
        # 90GiB-virtual/~5.2GiB-actual Windows Server 2019 guest under
        # CONVERT_MODE=direct-v2v.
        - name: workdir
          emptyDir:
            sizeLimit: 8Gi
        # Points at the source file/directory on the NODE (not inside the
        # container) for SOURCE_IMAGE_PATH to mount in as /input. Replace
        # the path below with wherever your source .ova/.vmdk/OVF
        # directory actually lives on the scheduling node. Testing used a
        # path like /home/<user>/vm-import/<source-name> on a single-node
        # test cluster; a hostPath volume ties the Pod to that specific
        # node (see OPERATIONS-GUIDE.md Section 4.1 for the SOURCE_IMAGE_URL
        # alternative, which has no such constraint).
        - name: source-input
          hostPath:
            path: /CHANGE-ME/path/to/your/source-image-or-ovf-directory
            type: Directory
