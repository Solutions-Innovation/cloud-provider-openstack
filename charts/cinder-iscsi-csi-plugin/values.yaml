extraLabels: {}

nameOverride: ""
fullnameOverride: ""
timeout: 3m

csi:
  attacher:
    image:
      repository: registry.k8s.io/sig-storage/csi-attacher
      tag: v4.10.0
      pullPolicy: IfNotPresent
    resources: {}
    extraArgs: {}
    extraEnv: []
  provisioner:
    topology: "false"
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v5.3.0
      pullPolicy: IfNotPresent
    resources: {}
    extraArgs: {}
    extraEnv: []
  livenessprobe:
    image:
      repository: registry.k8s.io/sig-storage/livenessprobe
      tag: v2.17.0
      pullPolicy: IfNotPresent
    failureThreshold: 5
    initialDelaySeconds: 10
    timeoutSeconds: 10
    periodSeconds: 60
    # Node-specific overrides — node plugins need faster failure detection
    # than controller plugins. These override the shared values above for
    # the node DaemonSet only.
    node:
      failureThreshold: 5
      initialDelaySeconds: 10
      timeoutSeconds: 3
      periodSeconds: 10
    resources: {}
    extraArgs: {}
    extraEnv: []
  nodeDriverRegistrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.15.0
      pullPolicy: IfNotPresent
    resources: {}
    extraArgs: {}
    extraEnv: []
  plugin:
    image:
      repository: ghcr.io/solutions-innovation/cinder-csi
      pullPolicy: Always
      tag:  # defaults to .Chart.AppVersion
    volumes: []
    volumeMounts: []
    nodePlugin:
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: true
      podAnnotations: {}
      podLabels: {}
      podSecurityContext: {}
      securityContext: {}
      affinity: {}
      nodeSelector: {}
      tolerations:
        - operator: Exists
      kubeletDir: /var/lib/kubelet
      extraArgs: {}
    controllerPlugin:
      replicas: 1
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      podAnnotations: {}
      podLabels: {}
      podSecurityContext: {}
      securityContext: {}
      affinity: {}
      nodeSelector: {}
      tolerations: []
      extraArgs: {}
    resources: {}
    httpEndpoint:
      enabled: false
      port: 8080
    extraArgs: {}
    extraEnv: []

# Log verbosity level.
logVerbosityLevel: 2

# Secret for OpenStack cloud credentials (cloud.conf).
# Options:
# 1) Use existing secret (default): set enabled=true, create=false, set name
# 2) Create from values: set enabled=true, create=true, provide data below
# 3) Mount from host: set enabled=false, hostMount=true
# 4) Inject via agent: set enabled=false, hostMount=false
#
# Default: enabled=true expects a pre-existing Secret named
# "cinder-iscsi-csi-cloud-config" in the release namespace.
# Create it before install:
#   kubectl create secret generic cinder-iscsi-csi-cloud-config \
#     --from-file=cloud.conf=/path/to/cloud.conf -n kube-system
secret:
  enabled: true
  hostMount: false
  create: false
  filename: cloud.conf
  name: cinder-iscsi-csi-cloud-config
#  data:
#    cloud.conf: |-
#      [Global]
#      auth-url=http://openstack-control-plane
#      user-id=user-id
#      password=password
#      trust-id=trust-id
#      region=RegionOne
#      ca-file=/etc/cacert/ca-bundle.crt

# ConfigMap for iSCSI driver configuration (driver.conf).
# Contains no credentials — managed independently from the Secret.
driverConfig:
  enabled: true
  create: true
  name: cinder-iscsi-driver-config
  data:
    driver.conf: |-
      [ISCSI]
      enable-multipath = false
      chap-auth-enabled = true
      login-timeout = 30
      device-wait-timeout = 30
      iscsi-interface = default
      storage-interface =
      platform = x86_64
      os-type = linux2

      [Volume]
      create-timeout = 300
      detach-timeout = 120
      delete-volume-mode = retain

storageClass:
  enabled: true
  name: cinder-iscsi-migration
  isDefault: false
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  parameters:
    type: pure-iscsi
    availability: nova

# CDI StorageProfile patch.
# KubeVirt CDI auto-creates a StorageProfile per StorageClass but only
# populates claimPropertySets for known provisioners. Our custom provisioner
# (cinder-iscsi.csi.windriver.com) is not in CDI's built-in map, so without
# this patch CDI defaults DataVolume PVCs to volumeMode: Filesystem — which
# this block-only driver rejects.
#
# Enable this when CDI is installed on the cluster and DataVolumes will
# target this StorageClass (e.g., V2O/O2O migration workflows).
#
# The storageProfile name is automatically set to match storageClass.name.
#
# TODO: Upstream PR to kubevirt/containerized-data-importer to add
# cinder-iscsi.csi.windriver.com to CapabilitiesByProvisionerKey.
# Once merged and deployed, this patch becomes unnecessary.
storageProfile:
  enabled: true
  claimPropertySets:
    - accessModes:
        - ReadWriteOnce
      volumeMode: Block

# Cluster identifier — appended to volume metadata.
clusterID: "kubernetes"

priorityClassName: ""

imagePullSecrets: []

commonAnnotations: {}
