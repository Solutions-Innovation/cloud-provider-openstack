apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cinder-iscsi-csi.fullname" . }}-node-sa
  namespace: {{ .Release.Namespace }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "cinder-iscsi-csi.fullname" . }}-nodeplugin-role
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "cinder-iscsi-csi.fullname" . }}-nodeplugin-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "cinder-iscsi-csi.fullname" . }}-node-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cinder-iscsi-csi.fullname" . }}-nodeplugin-role
  apiGroup: rbac.authorization.k8s.io
