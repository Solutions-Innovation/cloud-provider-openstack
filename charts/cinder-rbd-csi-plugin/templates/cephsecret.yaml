{{- /*
Optional creation of the Ceph credential Secret.

The default is create: false — the operator duplicates the existing platform
client.cinder key into this Secret out of band, following the runbook. This
template exists only for environments that drive Helm from a secure values
source (--set-file, a sealed values file, an external secrets operator).

Never commit a Ceph key to a values file in version control.
*/ -}}
{{- if .Values.cephCredential.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cephCredential.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinder-rbd-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: ceph-credential
type: Opaque
stringData:
  {{ .Values.cephCredential.userIDKey }}: {{ required "cephCredential.userID is required when create is true" .Values.cephCredential.userID | quote }}
  {{ .Values.cephCredential.userKeyKey }}: {{ required "cephCredential.userKey is required when create is true" .Values.cephCredential.userKey | quote }}
{{- end }}
