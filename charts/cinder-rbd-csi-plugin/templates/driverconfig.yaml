{{- include "cinder-rbd-csi.validate" . -}}
{{- if and .Values.driverConfig.enabled .Values.driverConfig.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.driverConfig.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinder-rbd-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: csi-config
data:
  driver.conf: |
    # Generated by the openstack-cinder-rbd-csi Helm chart. Do not edit in place.
    #
    # Authentication lives separately in cloud.conf ([Global], from a Secret).
    # This file carries no credentials: expected-fsid is an environment
    # identifier and credential-path only names a directory.

    [RBD]
    mounter = {{ .Values.driverConfig.rbd.mounter }}
    exclusive = {{ .Values.driverConfig.rbd.exclusive }}
    expected-cluster-name = {{ .Values.driverConfig.rbd.expectedClusterName }}
    expected-fsid = {{ .Values.driverConfig.rbd.expectedFsid }}
    ceph-client-version-major = {{ .Values.driverConfig.rbd.cephClientVersionMajor }}
    credential-path = {{ .Values.driverConfig.rbd.credentialPath }}
    runtime-dir = {{ .Values.driverConfig.rbd.runtimeDir }}
    state-dir = {{ .Values.driverConfig.rbd.stateDir }}
    map-timeout = {{ .Values.driverConfig.rbd.mapTimeout }}
    unmap-timeout = {{ .Values.driverConfig.rbd.unmapTimeout }}
    device-wait-timeout = {{ .Values.driverConfig.rbd.deviceWaitTimeout }}
    max-volumes-per-node = {{ .Values.driverConfig.rbd.maxVolumesPerNode }}

    [Volume]
    create-timeout = {{ .Values.driverConfig.volume.createTimeout }}
    detach-timeout = {{ .Values.driverConfig.volume.detachTimeout }}
    default-volume-type = {{ .Values.driverConfig.volume.defaultVolumeType }}
    metadata-prefix = {{ .Values.driverConfig.volume.metadataPrefix }}
    delete-volume-mode = {{ .Values.driverConfig.volume.deleteVolumeMode }}
{{- end }}
